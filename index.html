<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Croissant Taiyaki Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{--bg:#181208;--bg2:#221a08;--bg3:#2e2210;--border:#3e2e14;--t1:#f2e4c4;--t2:#c8a258;--t3:#806830;--gold:#e0a830;--gold2:#c07828;--green:#3ec870;--red:#e85858;--blue:#48a8d0;--purple:#a07cc0;--card:#221a08}
[data-theme=light]{--bg:#fdf6e4;--bg2:#fffbee;--bg3:#f4e8c0;--border:#d8c080;--t1:#1a1005;--t2:#5a3808;--t3:#907830;--gold:#9a6800;--gold2:#a04808;--green:#157040;--red:#b82020;--blue:#1058a0;--purple:#604898;--card:#fffbee}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:15px}
body{background:var(--bg);color:var(--t1);font-family:"Segoe UI",-apple-system,sans-serif;min-height:100vh;line-height:1.6}
.topbar{background:var(--bg2);border-bottom:2px solid var(--gold);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;gap:8px;flex-wrap:wrap}
.logo{font-size:1.08rem;font-weight:800;color:var(--gold)}.logo em{color:var(--gold2);font-style:normal}
.topbar-r{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn{border:none;border-radius:7px;padding:5px 13px;cursor:pointer;font-size:.82rem;font-weight:700}
.btn-p{background:var(--gold);color:#181208}.btn-s{background:var(--bg3);border:1px solid var(--border);color:var(--t2)}
.lupd{font-size:.72rem;color:var(--t3)}
.mnav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:46px;z-index:290}
.mnav::-webkit-scrollbar{display:none}
.mnb{padding:10px 18px;border:none;border-bottom:3px solid transparent;background:none;color:var(--t2);cursor:pointer;white-space:nowrap;font-size:.86rem;font-weight:700}
.mnb:hover{color:var(--t1);background:var(--bg3)}.mnb.on{color:var(--gold);border-bottom-color:var(--gold)}
.tc{display:none}.tc.on{display:block}
.con{padding:16px 18px;max-width:1600px;margin:0 auto}
.snwrap{background:var(--bg);padding:10px 0 4px;position:sticky;top:90px;z-index:200}
.snav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.snb{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--t2);cursor:pointer;font-size:.8rem;font-weight:700}
.snb:hover{border-color:var(--gold);color:var(--gold)}.snb.on{background:var(--gold);border-color:var(--gold);color:#181208}
.sc{display:none}.sc.on{display:block}
.hero{background:linear-gradient(135deg,#8a5e14 0%,#5a3608 100%);border-radius:13px;padding:18px 22px;margin-bottom:16px;color:#fdf0d0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.hero .up{color:#88ffaa!important;font-weight:700}.hero .dn{color:#ffaaaa!important;font-weight:700}.hero .fl{color:rgba(255,240,200,.5)!important}
.hero-l .hl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.75;margin-bottom:4px}
.hero-l .hv{font-size:2rem;font-weight:900;line-height:1.1}
.hero-l .hs{font-size:.82rem;opacity:.85;margin-top:5px;line-height:1.7}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap}
.hsi .sv{font-size:1.05rem;font-weight:800}.hsi .sl{font-size:.66rem;opacity:.68;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;text-align:center}
.prorate{background:rgba(224,168,48,.1);border:1px solid rgba(224,168,48,.3);border-radius:10px;padding:13px 16px;margin-bottom:14px}
.prorate-title{font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:10px}
.prorate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.pi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.pi .pl{font-size:.67rem;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.pi .pv{font-size:1.05rem;font-weight:800;color:var(--t1)}.pi .pd{font-size:.72rem;margin-top:3px;font-weight:600}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px;position:relative;overflow:hidden}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.cg::before{background:var(--green)}.cr::before{background:var(--red)}.cy::before{background:var(--gold)}.cb::before{background:var(--blue)}.cp::before{background:var(--gold2)}
.kl{font-size:.66rem;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.kv{font-size:1.18rem;font-weight:800;line-height:1.2;color:var(--t1)}.ks{font-size:.71rem;color:var(--t3);margin-top:3px}.kd{font-size:.72rem;font-weight:700;margin-top:4px}
.tg{color:var(--green)!important}.tr{color:var(--red)!important}.ty{color:var(--gold)!important}.tb{color:var(--blue)!important}.tp{color:var(--gold2)!important}
.up{color:var(--green);font-weight:700}.dn{color:var(--red);font-weight:700}.fl{color:var(--t3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:14px}
.ct{font-size:.88rem;font-weight:700;margin-bottom:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--t1)}
.bdg{font-size:.67rem;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--t3);font-weight:700}
.bdg-y{background:rgba(224,168,48,.15);color:var(--gold);border:1px solid rgba(224,168,48,.3)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:var(--bg3);color:var(--t2);padding:9px 10px;text-align:right;font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;font-size:.76rem;vertical-align:middle}
th.tl{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--bg3);text-align:right;color:var(--t1);font-size:.8rem;vertical-align:middle}
td.tl{text-align:left;color:var(--t2);font-weight:600}
tr:hover td{background:var(--bg3)}
tr.tot td{background:rgba(224,168,48,.08);font-weight:800;border-top:2px solid var(--border);color:var(--t1)}
tr.shdr td{background:var(--bg3);font-weight:700;color:var(--gold);text-align:left!important;font-size:.72rem;text-transform:uppercase;padding:5px 10px}
tr.wr td{background:rgba(72,168,208,.06);font-size:.78rem}
tr.wr td.tl{color:var(--blue);font-weight:700}
.cw{position:relative;height:220px}.cw-lg{position:relative;height:270px}@media(max-width:900px){.cw{height:180px}.cw-lg{height:220px}}.cw canvas,.cw-lg canvas{max-width:100%!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:720px){.g2{grid-template-columns:1fr}.kg{grid-template-columns:repeat(2,1fr)}.hero-stats{gap:12px}}
.loading{text-align:center;padding:70px;color:var(--t3)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.stitle{font-size:.74rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.info-box{background:rgba(224,168,48,.08);border:1px solid rgba(224,168,48,.22);border-radius:9px;padding:11px 15px;font-size:.8rem;color:var(--gold);margin-bottom:14px;line-height:1.5}
.warn-box{background:rgba(232,88,88,.08);border:1px solid rgba(232,88,88,.22);border-radius:9px;padding:11px 15px;font-size:.8rem;color:var(--red);margin-bottom:14px}
.prog-wrap{background:var(--bg3);border-radius:4px;height:6px;overflow:hidden;margin-top:3px}.prog-bar{height:100%;border-radius:4px}
.pnl-p{color:var(--green)!important;font-weight:800}.pnl-n{color:var(--red)!important;font-weight:800}
.alcard{border-radius:10px;padding:12px 15px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px}
.alcard.danger{background:rgba(232,88,88,.09);border:1px solid rgba(232,88,88,.25)}
.alcard.warn{background:rgba(224,168,48,.08);border:1px solid rgba(224,168,48,.22)}
.alcard.good{background:rgba(62,200,112,.08);border:1px solid rgba(62,200,112,.22)}
.alcard.info{background:rgba(72,168,208,.08);border:1px solid rgba(72,168,208,.22)}
.al-t{font-size:.84rem;font-weight:700;margin-bottom:3px}.al-b{font-size:.78rem;color:var(--t2);line-height:1.5}
.alcard.danger .al-t{color:var(--red)}.alcard.warn .al-t{color:var(--gold)}.alcard.good .al-t{color:var(--green)}.alcard.info .al-t{color:var(--blue)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">&#x1F41F; Croissant <em>Taiyaki</em> Dashboard</div>
  <div class="topbar-r">
    <span class="dot" id="dot"></span>
    <span class="lupd" id="lupd">Loading...</span>
    <button class="btn btn-p" onclick="loadData()">&#8635; Refresh</button>
    <button class="btn btn-s" onclick="toggleTheme()">&#9728; / &#127769;</button>
  </div>
</div>
<nav class="mnav">
  <button class="mnb on" onclick="showTab(this,'tab-sum')">&#x1F4CA; Summary</button>
  <button class="mnb" onclick="showTab(this,'tab-br')">&#x1F3EA; สาขา</button>
  <button class="mnb" onclick="showTab(this,'tab-pnl')">&#x1F4B0; P&amp;L</button>
  <button class="mnb" onclick="showTab(this,'tab-alert')">&#x1F514; วิเคราะห์</button>
</nav>
<div class="tc on" id="tab-sum"><div class="con"><div class="loading" id="sum-load"><div class="spinner"></div>Loading...</div><div id="sum-body" style="display:none"></div></div></div>
<div class="tc" id="tab-br"><div class="con"><div class="loading" id="br-load"><div class="spinner"></div>Loading...</div><div id="br-body" style="display:none"></div></div></div>
<div class="tc" id="tab-pnl"><div class="con"><div class="loading" id="pnl-load"><div class="spinner"></div>Loading...</div><div id="pnl-body" style="display:none"></div></div></div>
<div class="tc" id="tab-alert"><div class="con"><div class="loading" id="alert-load"><div class="spinner"></div>Loading...</div><div id="alert-body" style="display:none"></div></div></div>
<script>

const SALES_ID='1zLHLQahiCPiFKWjdCnJwGjm6fJ-3yDwZvkgJ6_TJ32o';
const EXP_ID='1CTyQv_9pJAZczJW4E7mh4UtOIxDLo2ddgPavx0RBZcc';
const MON_TH=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MON_EN=['','January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_TGT=15000;
// ชื่อ tab ใน Google Sheet — เพิ่มที่นี่เมื่อเปิดสาขาใหม่
const BRANCH_TABS=['Home Pro Bangna','Home Pro Rangsit','Victory','Mono Park','True Digital Park','Samyan Mitrtown','Secon Srinakarin','The Mall Ram','Cloud 11','The Mall บางกะปิ'];
function branchToTab(name){
  const n=(name||'').toLowerCase();
  for(const t of BRANCH_TABS){if(t.toLowerCase()===n)return t;}
  const kw={'bangna':'Home Pro Bangna','บางนา':'Home Pro Bangna',
    'rangsit':'Home Pro Rangsit','รังสิต':'Home Pro Rangsit',
    'victory':'Victory','mono':'Mono Park',
    'true digital':'True Digital Park','truedigital':'True Digital Park',
    'samyan':'Samyan Mitrtown','secon':'Secon Srinakarin',
    'srinakarin':'Secon Srinakarin','ศรีนครินทร์':'Secon Srinakarin','สีนครินทร์':'Secon Srinakarin',
    'mall ram':'The Mall Ram','ramkhamhaeng':'The Mall Ram','รามคำแหง':'The Mall Ram',
    'cloud':'Cloud 11',
    'บางกะปิ':'The Mall บางกะปิ','bangkapi':'The Mall บางกะปิ'};
  for(const[k,v]of Object.entries(kw)){if(n.indexOf(k)>=0)return v;}
  return name;
}
let allMonths=[],expenses=[],charts={};
// คำนวณวันทำการจาก target (วันที่ร้านเปิด ไม่นับวันหยุด)
// brAvg = avgDay จาก Sheet ตรงๆ (Sheet คำนวณ actual÷วันทำการไว้แล้ว)
function brOpDays(b){return b.avgDay>0&&b.actual>0?Math.max(1,Math.round(b.actual/b.avgDay)):1;}
function brAvg(b){return b.avgDay||0;}
function brDayTgt(b){var d=(b.opDays&&b.opDays>0)?b.opDays:brOpDays(b);return b.target&&d>0?Math.round(b.target/d):DAY_TGT;}
function totOpDays(m){var mx=0;for(var i=0;i<m.branches.length;i++){var b=m.branches[i];if(b.opDays&&b.opDays>mx)mx=b.opDays;}if(mx>0)return mx;for(var i=0;i<m.branches.length;i++){var b=m.branches[i];if(b.avgDay>0&&b.actual>0)return Math.max(1,Math.round(b.actual/b.avgDay));}return m.days||1;}
function totActDays(m){var mx=0;for(var i=0;i<m.branches.length;i++){var b=m.branches[i];if(b.actDays&&b.actDays>mx)mx=b.actDays;}return mx;}
function totAvg(m){var d=totActDays(m)||totOpDays(m);return d>0?m.total.actual/d:0;}
function totDayTgt(m){var d=totOpDays(m);return m.total&&m.total.target&&d>0?Math.round(m.total.target/d):DAY_TGT;}
function brAvgFull(b){if(b.actDays&&b.actDays>0)return b.actual/b.actDays;if(b.opDays&&b.opDays>0)return b.actual/b.opDays;return brAvg(b);}

function fetchGviz(id, sheetName){
  return new Promise((res,rej)=>{
    const cb='gviz_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const el=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej(new Error('Timeout'));},20000);
    function cleanup(){clearTimeout(t);delete window[cb];el.parentNode&&el.parentNode.removeChild(el);}
    window[cb]=d=>{cleanup();if(d&&d.status==='error')rej(new Error('Sheet not found'));else res(d);};
    el.onerror=()=>{cleanup();rej(new Error('โหลด Sheet ไม่ได้ — ตรวจสอบ "Anyone with link can view"'));};
    const sheetParam=sheetName?'&sheet='+encodeURIComponent(sheetName):'';
    // tq=select * บังคับให้ Google ส่งข้อมูลสดเสมอ — ถ้าไม่มี tq Google อาจส่ง cache เก่าค้างหลายสัปดาห์
    el.src='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=responseHandler:'+cb+sheetParam+'&tq='+encodeURIComponent('select *');
    document.head.appendChild(el);
  });
}

function gvizRows(d){
  if(!d||!d.table)return[];
  return(d.table.rows||[]).map(r=>(r.c||[]).map(c=>(!c||c.v==null)?'':(c.f!=null?String(c.f):String(c.v))));
}

function pn(s){
  s=String(s||'').replace(/,/g,'').replace(/฿/g,'').trim();
  if(!s||s==='#DIV/0!'||s==='-'||s==='Infinity'||s==='#N/A'||s==='#VALUE!')return 0;
  return parseFloat(s)||0;
}

function parseSales(rows){
  const months=[];let cur=null;
  for(const c of rows){
    const c1=(c[1]||'').trim();
    if(c1.indexOf('Sale Performance')===0){
      const pts=c1.split(' ');
      const mi=MON_EN.indexOf(pts[2]);const yr=parseInt(pts[3])||2026;
      const days=pn(c[c.length-1])||pn(c[20]);
      cur={monthIdx:mi,year:yr,monthName:pts[2],monthTH:MON_TH[mi],days,branches:[]};
      months.push(cur);continue;
    }
    if(!cur||c1.indexOf('Branch')>=0)continue;
    if(!c1&&pn(c[3])>0){cur.total=r2o(c,true);continue;}
    if(!c1)continue;
    if(c1.indexOf('Sale')!==0){const b=r2o(c,false);b.name=c1.replace('ฺ','').trim();if(b.actual>0||b.target>0)cur.branches.push(b);}
  }
  months.forEach(m=>{if(!m.total&&m.branches.length)m.total=agg(m.branches);});
  return months.filter(m=>m.branches.length>0);
}

function r2o(c,isTotal){
  const actual=pn(c[3]),delivery=pn(c[10]),grab=pn(c[13]),lineman=pn(c[16]);
  const tcInStore=pn(c[8]),tcDel=pn(c[11]),tcGrab=pn(c[14]),tcLine=pn(c[17]);
  let inStore=pn(c[7]);
  if(!isTotal&&inStore>actual)inStore=Math.max(0,actual-delivery);
  const tc=pn(c[5]),ta=tc?actual/tc:pn(c[6]);
  return{target:pn(c[2]),actual,tc,ta,
    inStore,tcInStore,taInStore:tcInStore?inStore/tcInStore:0,
    delivery,tcDel,taDel:tcDel?delivery/tcDel:0,
    grab,tcGrab,taGrab:tcGrab?grab/tcGrab:0,
    lineman,tcLine,taLine:tcLine?lineman/tcLine:0,
    avgDay:pn(c[20])};
}

function agg(brs){
  const s=f=>brs.reduce((a,b)=>a+(b[f]||0),0);
  const t={target:s('target'),actual:s('actual'),tc:s('tc'),inStore:s('inStore'),tcInStore:s('tcInStore'),
    delivery:s('delivery'),tcDel:s('tcDel'),grab:s('grab'),tcGrab:s('tcGrab'),lineman:s('lineman'),tcLine:s('tcLine')};
  t.pct=t.target?t.actual/t.target*100:0;t.ta=t.tc?t.actual/t.tc:0;
  t.taInStore=t.tcInStore?t.inStore/t.tcInStore:0;t.taDel=t.tcDel?t.delivery/t.tcDel:0;
  t.taGrab=t.tcGrab?t.grab/t.tcGrab:0;t.taLine=t.tcLine?t.lineman/t.tcLine:0;
  return t;
}

function parseDailyOps(rows){
  // opMap    = วันที่ target > 0 (ใช้คำนวณ เป้า/วัน)
  // actMap   = วันที่ actual > 0 (ใช้คำนวณ AVG/วัน)
  // dailyMap = ข้อมูลรายวัน [{n:วันที่, t:target, a:actual}] ต่อเดือน (ใช้ Trend chart)
  const opMap={},actMap={},dailyMap={};
  let dateCol=1,tgtCol=2;
  let firstMi=-1,firstYr=2026;
  for(var _i=0;_i<rows.length;_i++){
    var _c=rows[_i];
    var hdr='';
    var _c0=(_c[0]||'').trim(),_c1=(_c[1]||'').trim();
    if(_c0.indexOf('Sale Performance')===0){dateCol=0;tgtCol=1;hdr=_c0;}
    else if(_c1.indexOf('Sale Performance')===0){dateCol=1;tgtCol=2;hdr=_c1;}
    if(hdr){
      var pts=hdr.split(' ');
      firstMi=MON_EN.indexOf(pts[pts.length-2]);
      firstYr=parseInt(pts[pts.length-1])||2026;
      break;
    }
  }
  // Strategy 2: gviz ไม่ส่ง header row — ตรวจ firstMi จาก date value (d/m/yyyy)
  if(firstMi<1){
    for(var _dc=0;_dc<=1&&firstMi<1;_dc++){
      for(var _i2=0;_i2<rows.length&&firstMi<1;_i2++){
        var _dv=(rows[_i2][_dc]||'').trim();
        if(!_dv)continue;
        var _m=_dv.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if(_m){
          var _mo=parseInt(_m[2]),_yr2=parseInt(_m[3]);
          if(_mo>=1&&_mo<=12&&_yr2>=2020&&_yr2<=2030){
            firstMi=_mo;firstYr=_yr2;dateCol=_dc;tgtCol=_dc+1;
          }
        }
      }
    }
  }
  if(firstMi<1)return{opMap,actMap};
  var secIdx=0,cur=[];
  var actCol=tgtCol+1;
  function flush(){
    if(!cur.length)return;
    var mi=firstMi+secIdx,yr=firstYr+Math.floor((mi-1)/12);
    mi=((mi-1)%12)+1;
    var cnt=0,actCnt=0,days=[];
    for(var j=0;j<cur.length;j++){
      var tgt=pn(cur[j][tgtCol]),act=pn(cur[j][actCol]);
      if(tgt>0)cnt++;
      if(act>0)actCnt++;
      var dstr=(cur[j][dateCol]||'').trim();
      var dm=dstr.match(/^(\d{1,2})\//);
      var dayNum=dm?parseInt(dm[1]):0;
      if(dayNum>0)days.push({n:dayNum,t:tgt,a:act});
    }
    var mk2=mi+'_'+yr;
    if(cnt>0)opMap[mk2]=cnt;
    if(actCnt>0)actMap[mk2]=actCnt;
    if(days.length)dailyMap[mk2]=days;
    secIdx++;cur=[];
  }
  for(var i=0;i<rows.length;i++){
    var c=rows[i];
    if((c[0]||'').indexOf('Sale Performance')===0||(c[1]||'').indexOf('Sale Performance')===0)continue;
    var dv=(c[dateCol]||'').trim();
    if(!dv){flush();continue;}
    cur.push(c);
  }
  flush();
  return{opMap,actMap,dailyMap};
}

function parseExpense(rows, fallbackMonth){
  const items=[];let month=fallbackMonth||'';
  for(const c of rows){
    const c1=(c[1]||'').trim();
    const det=(c[3]||'').trim();
    // skip แถวที่ c[1] และ c[3] ว่างพร้อมกัน (แถวว่าง / แถว Total)
    if(!c1&&!det)continue;
    if(/\d{4}/.test(c1)&&c.filter(x=>x).length<=4){month=c1;continue;}
    if(c1==='No.'||c1==='No')continue;
    const cost=pn(c[6])||pn(c[5]);
    if(cost>0)items.push({month,date:(c[2]||'').trim(),detail:det,category:(c[4]||'').trim(),supplier:(c[5]||'').trim(),cost});
  }
  return items;
}

const fmt=n=>n?'฿'+Math.round(n).toLocaleString('th-TH'):'฿0';
const fmtE=n=>n!=null&&n!==0?'฿'+n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}):'฿0.00';
const fmtN=n=>Math.round(n).toLocaleString('th-TH');
const fmtP=n=>(n||0).toFixed(1)+'%';
const dlt=(a,b)=>(!b||b===0)?null:(a-b)/Math.abs(b)*100;
function dH(d){if(d===null||d===undefined||isNaN(d))return'<span class="fl">—</span>';return`<span class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'}${Math.abs(d).toFixed(1)}%</span>`;}
const acls=p=>p>=100?'tg':p>=80?'ty':'tr';
const akcls=p=>p>=100?'cg':p>=80?'cy':'cr';
const tcF=tc=>tc>0?fmtN(tc):'—';
const taF=(tc,ta)=>tc>0?fmt(ta):'—';

function momD(cur,prev){if(!prev||!cur)return null;return dlt(totAvg(cur),totAvg(prev));}
function momDBr(b,m,pb,pm){if(!pm||!m||!pb)return null;return dlt(brAvgFull(b),brAvgFull(pb));}
function partLabel(m){const now=new Date();if(m.year===now.getFullYear()&&m.monthIdx===(now.getMonth()+1))return' <span style="font-size:.68rem;color:var(--blue);">('+now.getDate()+'วัน/'+m.days+'วัน)</span>';return'';}

function proRate(m,b){
  const now=new Date(),isCur=m.year===now.getFullYear()&&m.monthIdx===(now.getMonth()+1);
  const dim=m.days||new Date(m.year,m.monthIdx,0).getDate();
  const elapsed=isCur?Math.min(now.getDate(),dim):dim;
  const daysLeft=dim-elapsed;
  const target=b?b.target:m.total.target,actual=b?b.actual:m.total.actual;
  const pTarget=target/dim*elapsed,pAch=pTarget?actual/pTarget*100:0;
  const fullAch=target?actual/target*100:0,remaining=target-actual;
  const needed=daysLeft>0?remaining/daysLeft:0;
  return{isCur,elapsed,dim,daysLeft,pTarget,pAch,fullAch,remaining,needed};
}

function wow(fld,cur,prev){const we=cur.days?(cur.total[fld]||0)/cur.days*7:0;const pe=prev&&prev.days?(prev.total[fld]||0)/prev.days*7:null;return{we,pe,d:dlt(we,pe)};}
function wowBr(fld,b,m,pb,pm){const we=m.days?(b[fld]||0)/m.days*7:0;const pe=pm&&pm.days?(pb&&pb[fld]||0)/pm.days*7:null;return{we,pe,d:dlt(we,pe)};}

// WoW period labels — show exactly which days are being compared
function wowLabel(m,prev){
  const now=new Date();
  const isCur=m.year===now.getFullYear()&&m.monthIdx===(now.getMonth()+1);
  // Current period: actual elapsed days of this month
  const elapsed=isCur?Math.min(now.getDate(),m.days):m.days;
  const curLabel=isCur
    ? `${m.monthTH} ${m.year}: 1–${elapsed} ${m.monthTH} (${elapsed} วัน) → AVG/สัปดาห์ = <strong>${fmt(m.total.actual/elapsed*7)}</strong>`
    : `${m.monthTH} ${m.year}: ทั้งเดือน (${m.days} วัน) → AVG/สัปดาห์ = <strong>${fmt(m.total.actual/m.days*7)}</strong>`;
  // Previous period: full month
  const prevLabel=prev
    ? `${prev.monthTH} ${prev.year}: ทั้งเดือน (${prev.days} วัน) → AVG/สัปดาห์ = <strong>${fmt(prev.total.actual/prev.days*7)}</strong>`
    : null;
  return{curLabel,prevLabel,elapsed};
}
function wowBrLabel(b,m,pb,pm){
  const now=new Date();
  const isCur=m.year===now.getFullYear()&&m.monthIdx===(now.getMonth()+1);
  const elapsed=isCur?Math.min(now.getDate(),m.days):m.days;
  const curLabel=isCur
    ? `1–${elapsed} ${m.monthTH} (${elapsed} วัน) → ${fmt(b.actual/elapsed*7)}/สัปดาห์`
    : `ทั้งเดือน ${m.monthTH} (${m.days} วัน) → ${fmt(b.actual/m.days*7)}/สัปดาห์`;
  const prevLabel=pm&&pb
    ? `ทั้งเดือน ${pm.monthTH} (${pm.days} วัน) → ${fmt(pb.actual/pm.days*7)}/สัปดาห์`
    : null;
  return{curLabel,prevLabel,elapsed};
}

function kcard(l,v,s,d,cls){return`<div class="kc ${cls||''}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div>${d?`<div class="kd">${d}</div>`:''}</div>`;}

async function loadData(){
  setS('gold','กำลังโหลด...');
  try{
    // Sales: อ่านจาก tab "Summary Month" โดยตรง
    const sd=await fetchGviz(SALES_ID,'Summary Month');
    allMonths=parseSales(gvizRows(sd));

    // ── Branch daily tabs: opDays = วันที่มียอดขายจริง > 0 ต่อสาขา ต่อเดือน ──
    // fetch จาก BRANCH_TABS โดยตรง (ชื่อ tab ใน Sheet) ไม่ใช้ b.name
    const _tabFetches=BRANCH_TABS.map(function(tn){
      return fetchGviz(SALES_ID,tn).then(function(d){
        const rows=gvizRows(d);
        if(!rows.length)return{n:tn,ops:{},acts:{},days:{}};
        const h0=(rows[0][0]||'').trim(),h1=(rows[0][1]||'').trim();
        const hdr=h0.indexOf('Sale Performance')===0?h0:h1.indexOf('Sale Performance')===0?h1:'';
        if(hdr){const pts=hdr.split(' ');if(MON_EN.indexOf(pts[2])>0)return{n:tn,ops:{},acts:{},days:{}};}
        const{opMap,actMap,dailyMap}=parseDailyOps(rows);
        return{n:tn,ops:opMap,acts:actMap,days:dailyMap};
      }).catch(function(){return{n:tn,ops:{},acts:{},days:{}};});
    });
    const _tabRes=await Promise.allSettled(_tabFetches);
    const _tabOps={},_tabActs={},_tabDays={};
    for(const r of _tabRes){if(r.status==='fulfilled'&&r.value){_tabOps[r.value.n]=r.value.ops;_tabActs[r.value.n]=r.value.acts;_tabDays[r.value.n]=r.value.days;}}
    // เซ็ต b.opDays, b.actDays, b.dailyData ต่อสาขา
    allMonths.forEach(function(m){
      const mk=m.monthIdx+'_'+m.year;
      m.branches.forEach(function(b){
        const tn=branchToTab(b.name);
        const bops=_tabOps[tn],bacts=_tabActs[tn],bdays=_tabDays[tn];
        if(bops&&bops[mk]>0)b.opDays=bops[mk];
        if(bacts&&bacts[mk]>0)b.actDays=bacts[mk];
        if(bdays)b.dailyData=bdays; // {monthKey: [{n,t,a}]} — ทุกเดือนของ branch นี้
      });
    });

    // ─── Fallback: estimate opDays จาก Summary Month target/days ratio ────────────
    // ถ้า daily tab fetch สำเร็จ (b.opDays set แล้ว) → ข้าม
    // ถ้าไม่ → ใช้ refRate 2 ระดับ:
    //   brRefRate  = rate สูงสุดของ branch นี้ เดือนที่ดูเป็น full (ใช้ถ้า brRef ≥ 70% ของ monRef)
    //   monRefRate = rate สูงสุดของทุก branch ในเดือนเดียวกัน (anchor จาก branch ที่เปิดเต็มเดือน)
    // → รองรับ branch เพิ่งเปิด (เดือนแรกเป็น partial, ยังไม่มี brRef ที่เชื่อถือได้)
    {
      const _brRefRate={}, _monRefRate={};
      allMonths.forEach(function(m){
        if(!m.days)return;
        const mk=m.monthIdx+'_'+m.year;
        m.branches.forEach(function(b){
          if(!b.target)return;
          const rate=(b.opDays&&b.opDays>0)?b.target/b.opDays:b.target/m.days;
          if(!_brRefRate[b.name]||rate>_brRefRate[b.name])_brRefRate[b.name]=rate;
          if(!_monRefRate[mk]||rate>_monRefRate[mk])_monRefRate[mk]=rate;
        });
      });
      allMonths.forEach(function(m){
        if(!m.days)return;
        const mk=m.monthIdx+'_'+m.year;
        m.branches.forEach(function(b){
          if(b.opDays)return;
          if(!b.target||!b.actual)return;
          const brRef=_brRefRate[b.name]||0;
          const monRef=_monRefRate[mk]||0;
          // ถ้า brRef สูงพอ (≥70% ของ monRef) → เชื่อ brRef (เฉพาะ branch)
          // ถ้า brRef ต่ำมาก → branch นี้เพิ่งเปิด/เดือนแรกเป็น partial → ใช้ monRef จาก branch อื่น
          const ref=(brRef>=monRef*0.7)?brRef:monRef;
          if(!ref)return;
          const rate=b.target/m.days;
          if(rate<ref*0.7){
            const op=Math.max(1,Math.round(b.target/ref));
            if(op<m.days)b.opDays=op;
          }
        });
      });
      // ─── Debug: แสดงผล opDays ทุกสาขาทุกเดือนใน Console ────────────────────────
      console.group('[Taiyaki] opDays debug — เชคว่านับวันถูกไหม');
      console.log('brRefRate:', Object.fromEntries(Object.entries(_brRefRate).map(([k,v])=>[k,Math.round(v)])));
      console.log('monRefRate:', Object.fromEntries(Object.entries(_monRefRate).map(([k,v])=>[k,Math.round(v)])));
      allMonths.forEach(function(m){
        const rows=m.branches.map(function(b){
          return{branch:b.name,opDays:b.opDays||'(ไม่มี→calDays='+m.days+')',target:b.target,actual:b.actual,
            avgOp:b.opDays?Math.round(b.actual/b.opDays):Math.round(b.avgDay)};
        });
        console.log(m.monthTH+' '+m.year+' (calDays='+m.days+')', rows);
      });
      console.groupEnd();
    }

    // Expenses: fetch เฉพาะเดือนที่อยู่ใน allMonths + เดือนปัจจุบัน พร้อม date validation กัน fallback data
    const MUPPR=['','JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    const MTTL=['','January','February','March','April','May','June','July','August','September','October','November','December'];
    const now=new Date();
    const expFetches=[];
    const seenMY=new Set();
    const monthsToTry=[];
    allMonths.forEach(function(m){const k=m.monthIdx+'_'+m.year;if(!seenMY.has(k)){seenMY.add(k);monthsToTry.push({mi:m.monthIdx,yr:m.year});}});
    const curMi=now.getMonth()+1,curYr=now.getFullYear(),curK=curMi+'_'+curYr;
    if(!seenMY.has(curK))monthsToTry.push({mi:curMi,yr:curYr});
    for(const {mi,yr} of monthsToTry){
      const mu=MUPPR[mi]+' '+yr, mt=MTTL[mi]+' '+yr;
      const expMon=String(mi).padStart(2,'0');
      [mu,mt,mt+'.',mt+'..',mt+'...'].forEach(function(name){
        const cn=name.replace(/\.+$/,'').trim();
        expFetches.push(
          fetchGviz(EXP_ID,name).then(function(d){
            const items=parseExpense(gvizRows(d),cn);
            if(!items.length)return[];
            // date validation: ถ้า majority item ไม่ match เดือนที่คาดหวัง = fallback data → ทิ้ง
            const dated=items.filter(function(e){return e.date&&e.date.split('-').length>=2;});
            if(dated.length>0){
              const ok=dated.filter(function(e){return e.date.split('-')[1]===expMon;}).length;
              if(ok/dated.length<0.5)return[];
            }
            return items;
          }).catch(function(){return[];})
        );
      });
    }
    const expResults=await Promise.allSettled(expFetches);
    const seenK=new Set();expenses=[];
    for(const r of expResults){
      if(r.status==='fulfilled'){
        for(const item of r.value){
          // normalize month to lowercase for dedup key → ป้องกัน "MAY 2026" กับ "May 2026" นับซ้ำ
          const normM=item.month.toLowerCase().replace(/\.+$/,'').trim();
          const k=`${normM}|${item.date}|${item.detail}|${item.cost}`;
          if(!seenK.has(k)){seenK.add(k);expenses.push(item);}
        }
      }
    }

    // ── สร้าง summaryDaily: รวม actual/target ต่อวันจากทุกสาขา ──
    window._summaryDaily={};
    allMonths.forEach(function(m){
      const mk=m.monthIdx+'_'+m.year;
      const dayMap={};
      m.branches.forEach(function(b){
        if(!b.dailyData||!b.dailyData[mk])return;
        b.dailyData[mk].forEach(function(d){
          if(!dayMap[d.n])dayMap[d.n]={t:0,a:0};
          dayMap[d.n].t+=d.t;
          dayMap[d.n].a+=d.a;
        });
      });
      const dkeys=Object.keys(dayMap).map(Number).sort(function(a,b){return a-b;});
      if(dkeys.length>0)window._summaryDaily[mk]=dkeys.map(function(n){return{n:n,t:dayMap[n].t,a:dayMap[n].a};});
    });

    renderAll();
    setS('green','อัปเดต: '+new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',hour12:false}));
  }catch(e){
    console.error(e);setS('red','โหลดไม่ได้');
    ['sum-load','br-load','pnl-load','alert-load'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.innerHTML=`<div style="color:var(--red);line-height:2.5">⚠ ${e.message}<br><button class="btn btn-p" onclick="loadData()" style="margin-top:10px">ลองใหม่</button></div>`;
    });
  }
}

function renderAnalysis(){
  hide('alert-load');show('alert-body');
  const latest=allMonths[allMonths.length-1],prev=allMonths[allMonths.length-2];
  if(!latest){document.getElementById('alert-body').innerHTML='<div class="warn-box">ไม่มีข้อมูล</div>';return;}
  const t=latest.total,pr=proRate(latest,null);
  const achPct=t.actual&&t.target?t.actual/t.target*100:0;
  const alerts=[],warns=[],goods=[],infos=[];
  latest.branches.forEach(b=>{
    const pct=b.target?b.actual/b.target*100:0,pb=prev&&prev.branches.find(x=>x.name===b.name);
    const mom=pb?momDBr(b,latest,pb,prev):null,avgD=latest.days?b.actual/latest.days:0;
    const bpr=proRate(latest,b),delPct=b.actual?b.delivery/b.actual*100:0;
    if(pct<70)alerts.push({t:'🔴 '+b.name+': ยอดต่ำกว่าเป้ามาก',b:'Achievement '+fmtP(pct)+' · Prorate Ach '+fmtP(bpr.pAch)+' · ขาด '+fmt(Math.max(0,b.target-b.actual))});
    else if(pct<100)warns.push({t:'🟡 '+b.name+': ยังไม่ถึงเป้า',b:'Achievement '+fmtP(pct)+' · ต้องทำ '+fmt(bpr.needed)+'/วัน · เหลือ '+bpr.daysLeft+' วัน'});
    else goods.push({t:'🟢 '+b.name+': ผ่านเป้าแล้ว',b:'Achievement '+fmtP(pct)+' · ยอด '+fmt(b.actual)});
    if(mom!==null&&mom<-15)alerts.push({t:'📉 '+b.name+': ยอด AVG/วัน ลด MoM',b:dH(mom)+' เทียบ AVG/วัน เดือนก่อน'});
    if(mom!==null&&mom>20)goods.push({t:'📈 '+b.name+': ยอดเติบโตดี',b:dH(mom)+' AVG/วัน MoM'});
    if(avgD<DAY_TGT*0.6)warns.push({t:'⏰ '+b.name+': AVG/วันต่ำ',b:fmt(avgD)+' vs เป้า '+fmt(DAY_TGT)+' — ลอง Flash Sale'});
    if(delPct>60)infos.push({t:'📦 '+b.name+': Delivery สัดส่วนสูง',b:'Del '+fmtP(delPct)+' — อาจต้องกระตุ้น Walk-in'});
  });
  if(achPct>=100)goods.push({t:'🏆 ภาพรวม: ผ่านเป้า',b:'Achievement '+fmtP(achPct)+' · Prorate Ach '+fmtP(pr.pAch)});
  else warns.push({t:'⚠ ภาพรวม: ยังไม่ถึงเป้า',b:'Achievement '+fmtP(achPct)+' · Prorate Ach '+fmtP(pr.pAch)+' · ขาด '+fmt(Math.max(0,t.target-t.actual))});
  let h=`<div class="info-box">🤖 วิเคราะห์: <strong>${latest.monthTH} ${latest.year}</strong> · ${latest.branches.length} สาขา · ยอดรวม <strong>${fmt(t.actual)}</strong> · Prorate Ach <strong class="${acls(pr.pAch)}">${fmtP(pr.pAch)}</strong></div>`;
  h+='<div class="kg">';
  h+=kcard('🔴 ต้องแก้ด่วน',`<span class="tr">${alerts.length}</span>`,'รายการ','','cr');
  h+=kcard('🟡 ควรระวัง',`<span class="ty">${warns.length}</span>`,'รายการ','','cy');
  h+=kcard('🟢 ผลดี',`<span class="tg">${goods.length}</span>`,'รายการ','','cg');
  h+=kcard('ℹ️ สังเกต',`<span class="tb">${infos.length}</span>`,'รายการ','','cb');
  h+='</div>';
  h+='<div class="g2"><div class="card"><div class="ct">🎯 Achievement % รายสาขา</div><div class="cw"><canvas id="c-ach-al"></canvas></div></div>';
  h+='<div class="card"><div class="ct">📈 Trend AVG/วัน vs เป้า</div><div class="cw"><canvas id="c-avgd"></canvas></div></div></div>';
  const rCards=(arr,cls)=>arr.forEach(a=>h+=`<div class="alcard ${cls}"><div><div class="al-t">${a.t}</div><div class="al-b">${a.b}</div></div></div>`);
  if(alerts.length){h+='<div class="stitle">🔴 ต้องดำเนินการด่วน</div>';rCards(alerts,'danger');}
  if(warns.length){h+='<div class="stitle">🟡 ควรติดตาม</div>';rCards(warns,'warn');}
  if(infos.length){h+='<div class="stitle">ℹ️ ข้อสังเกต</div>';rCards(infos,'info');}
  if(goods.length){h+='<div class="stitle">🟢 ผลลัพธ์ที่ดี</div>';rCards(goods,'good');}
  const recs=['🎯 จัด Flash Sale / Happy Hour ดึง Walk-in','🛍️ เพิ่ม Bundle Set เพิ่ม TA (ยอดต่อคน)'];
  const low=latest.branches.filter(b=>b.target&&b.actual/b.target<0.9);
  if(low.length)recs.push('🏪 Focus: '+low.map(b=>b.name).join(', '));
  recs.push('📊 กรอกข้อมูลรายวันใน Sheet เพื่อให้ WoW แม่นยำ');
  h+='<div class="card"><div class="ct">💡 Next Steps</div>';
  recs.forEach((r,i)=>h+=`<div style="padding:9px 2px;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--t2)"><span style="color:var(--gold);font-weight:700">${i+1}.</span> ${r}</div>`);
  h+='</div>';
  document.getElementById('alert-body').innerHTML=h;
  setTimeout(()=>{
    const lb=latest.branches.map(b=>b.name);
    const achVals=latest.branches.map(b=>b.target?+(b.actual/b.target*100).toFixed(1):0);
    mkBar('c-ach-al',lb,[{l:'Achievement %',d:achVals,c:achVals.map(v=>v>=100?'#3ec870':v>=80?'#e0a830':'#e85858')}],false,true);
    const bNames=[...new Set(allMonths.flatMap(m=>m.branches.map(b=>b.name)))].slice(0,5);
    mkLine('c-avgd',allMonths.map(m=>m.monthTH+String(m.year).slice(2)),
      bNames.map((n,ni)=>({l:n,fill:false,c:['#e0a830','#c07828','#3ec870','#48a8d0','#a07cc0'][ni],dash:[],
        d:allMonths.map(m=>{const b=m.branches.find(x=>x.name===n);return b&&m.days?+(b.actual/m.days).toFixed(0):null;})}))
      .concat([{l:'เป้า '+fmt(DAY_TGT)+'/วัน',d:allMonths.map(()=>DAY_TGT),c:'rgba(232,88,88,.6)',fill:false,dash:[5,4]}]));
  },0);
}

function mkBar(id,labels,datasets,stacked,indexAxis){
  var ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();var g=gc();
  charts[id]=new Chart(ctx,{type:'bar',

function mkDonut(id,labels,data,colors){

function showTab(btn,id){document.querySelectorAll('.mnb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('.tc').forEach(function(t){t.classList.remove('on');});btn.classList.add('on');document.getElementById(id).classList.add('on');}
function switchMon(btn,id){document.querySelectorAll('#snav .snb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#sum-body > .sc').forEach(function(s){s.classList.remove('on');});btn.classList.add('on');var el=document.getElementById(id);if(el)el.classList.add('on');}
function switchExpMon(btn,id){document.querySelectorAll('#exp-nav .snb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#pnl-body > .sc').forEach(function(s){s.classList.remove('on');});btn.classList.add('on');var el=document.getElementById(id);if(el){el.classList.add('on');requestAnimationFrame(function(){window.dispatchEvent(new Event('resize'));});}}
function switchBr(btn,id){document.querySelectorAll('#br-tabs .snb').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('#br-body > .sc').forEach(function(s){s.classList.remove('on');});btn.classList.add('on');var el=document.getElementById(id);if(el)el.classList.add('on');}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');setTimeout(function(){Object.values(charts).forEach(function(c){if(!c)return;var g=gc();['x','y','y2'].forEach(function(ax){if(c.options.scales&&c.options.scales[ax]){if(c.options.scales[ax].grid)c.options.scales[ax].grid.color=g.grid;if(c.options.scales[ax].ticks)c.options.scales[ax].ticks.color=g.tick;}});if(c.options.plugins&&c.options.plugins.legend)c.options.plugins.legend.labels.color=g.tick;c.update();});},200);}
function hide(id){var e=document.getElementById(id);if(e)e.style.display='none';}
function show(id){var e=document.getElementById(id);if(e)e.style.display='block';}
